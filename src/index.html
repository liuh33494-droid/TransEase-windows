<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TransEase 透镜 - Windows 原生客户端</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 1. 透镜交互翻译工作台 (默认主视图) -->
  <div class="lens-container" id="lensView">
    <div class="lens-header">
      <div class="lens-brand">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.5 8.5V6a2.5 2.5 0 0 1 2.5-2.5h2.5"/>
          <path d="M15.5 3.5H18A2.5 2.5 0 0 1 20.5 6v2.5"/>
          <path d="M8.5 20.5H6A2.5 2.5 0 0 1 3.5 18v-2.5"/>
          <path d="M20.5 15.5V18a2.5 2.5 0 0 1-2.5 2.5h-2.5"/>
          <circle cx="12" cy="12" r="5.2"/>
          <rect x="9.6" y="9.6" width="4.8" height="4.8" rx="1.2" transform="rotate(45 12 12)" fill="currentColor" fill-opacity="0.28"/>
        </svg>
        <span>透镜 · Alt+X</span>
      </div>

      <div class="lens-actions">
        <select class="lang-select" id="selectTargetLang" title="选择目标语言">
          <option value="zh-CN">译至 中文</option>
          <option value="en">译至 英文</option>
          <option value="ja">译至 日语</option>
          <option value="ko">译至 韩语</option>
          <option value="fr">译至 法语</option>
          <option value="de">译至 德语</option>
          <option value="es">译至 西语</option>
          <option value="ru">译至 俄语</option>
        </select>

        <button class="icon-btn" id="btnClipboard" title="一键读取剪贴板并翻译 (Alt+D)">
          📋
        </button>

        <button class="icon-btn" id="btnMode" title="切换实时字幕同传 (Alt+V)">
          🎙️
        </button>

        <button class="icon-btn" id="btnHistory" title="翻译历史">
          🕒
        </button>

        <button class="icon-btn" id="btnPin" title="切换穿透模式 (按 Alt+P 解锁恢复交互)">
          📌
        </button>

        <button class="icon-btn" id="btnSettings" title="偏好设置">
          ⚙️
        </button>

        <button class="icon-btn" id="btnClose" title="隐藏窗口 (Esc)">
          ✕
        </button>
      </div>
    </div>

    <div class="lens-content">
      <div class="input-wrap">
        <textarea id="sourceInput" class="source-textarea" placeholder="输入外文或按 Alt+D 直接读取剪贴板译文..." rows="3"></textarea>
        <button class="mini-clear-btn" id="btnClearInput" title="清空输入">✕</button>
      </div>

      <div class="result-card">
        <div class="result-meta">
          <span class="engine-badge" id="engineBadge">就绪 · 智能自适应</span>
          <div class="result-tools">
            <button class="mini-tool-btn" id="btnSpeak" title="语音朗读">🔊 朗读</button>
            <button class="mini-tool-btn" id="btnCopy" title="复制译文">📄 复制</button>
          </div>
        </div>
        <div class="lens-trans-box" id="lensTrans">
          在上方输入文本或点击 📋 / 按 Alt+D 读取剪贴板，译文将在此实时生成。
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 实时视频字幕与同传视图 (4行阶梯歌词流) -->
  <div class="subtitle-hud" id="subtitleHud">
    <div class="lens-header">
      <div class="lens-brand">
        <span>🎙️ 实时同传字幕 · 4行阶梯流</span>
      </div>
      <div class="lens-actions">
        <button class="mini-tool-btn" id="btnMicToggle" title="开启或暂停麦克风识别">▶ 开始听写</button>
        <button class="mini-tool-btn" id="btnExportSRT" title="导出 SRT 双语字幕">SRT</button>
        <button class="mini-tool-btn" id="btnClearSubtitles" title="清空字幕流">清空</button>
        <button class="icon-btn" id="btnReturnLens" title="返回翻译工作台">🔮</button>
      </div>
    </div>

    <div class="subtitle-rolling-box" id="subtitleRollingBox">
      <div class="subtitle-empty" id="subtitleEmpty">
        点击「▶ 开始听写」进行实时语音同传，或在下方输入实时句回车即时上屏翻译。
      </div>
    </div>

    <div class="subtitle-quick-bar">
      <input type="text" id="subtitleQuickInput" class="form-input" placeholder="输入外语句子按 Enter 立即加入 4 行阶梯双语字幕流..." style="flex: 1; font-size: 0.78rem;">
      <span id="speechStatusHint" class="speech-hint">就绪</span>
    </div>
  </div>

  <!-- 3. 历史记录面板 -->
  <div class="settings-modal" id="historyModal">
    <div class="settings-header">
      <span class="settings-title">最近翻译历史记录</span>
      <div style="display: flex; gap: 6px; align-items: center;">
        <button class="mini-tool-btn" id="btnClearHistory">清空</button>
        <button class="icon-btn" id="btnCloseHistory">✕</button>
      </div>
    </div>
    <div class="settings-body" id="historyList"></div>
  </div>

  <!-- 4. 设置面板 (Settings Modal) -->
  <div class="settings-modal" id="settingsModal">
    <div class="settings-header">
      <span class="settings-title">透镜偏好设置 (Windows v3.1.0)</span>
      <button class="icon-btn" id="btnCloseSettings">✕</button>
    </div>

    <div class="settings-body">
      <!-- 引擎选择 -->
      <div class="form-group">
        <label class="form-label">首选翻译引擎</label>
        <select class="form-input" id="selectEngine">
          <option value="auto">智能自适应 (已配百度优先直连，否则 Google -> MyMemory)</option>
          <option value="baidu">百度翻译开放平台 (国内官方免翻直连)</option>
          <option value="google">Google 极速 (需代理或直通网络)</option>
          <option value="mymemory">MyMemory 公共源</option>
        </select>
      </div>

      <!-- 百度密钥 -->
      <div class="form-group">
        <label class="form-label">百度翻译开放平台密钥 (国内官方直连)</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" class="form-input" id="baiduAppId" placeholder="App ID (纯数字)" style="flex: 1;">
          <input type="password" class="form-input" id="baiduAppKey" placeholder="密钥 (Secret Key)" style="flex: 1.5;">
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-test" id="btnTestBaidu">⚡ 测试连接与延迟</button>
        <span id="baiduStatus" class="status-badge"></span>
      </div>

      <!-- 网络代理设置 -->
      <div class="form-group">
        <label class="form-label">网络代理设置</label>
        <div style="display: flex; gap: 8px;">
          <select class="form-input" id="selectProxyMode" style="flex: 1;">
            <option value="system">自动跟随系统代理</option>
            <option value="manual">自定义本地代理端口</option>
            <option value="direct">纯直连模式</option>
          </select>
          <input type="text" class="form-input" id="proxyUrlInput" placeholder="http://127.0.0.1:7890" style="flex: 1.3; display: none;">
        </div>
      </div>

      <!-- 快捷键说明 -->
      <div class="form-group" style="margin-top: 4px;">
        <label class="form-label">Windows 系统全局快捷键</label>
        <div style="font-size: 0.74rem; color: #94a3b8; line-height: 1.75;">
          • <strong>Alt + X</strong>：显示 / 隐藏随动透镜工作台<br>
          • <strong>Alt + D</strong>：快速唤醒并读取剪贴板译文<br>
          • <strong>Alt + V</strong>：切换实时同传字幕流模式<br>
          • <strong>Alt + P</strong>：切换鼠标穿透与交互解锁（穿透后可用 Alt+P 恢复）<br>
          • <strong>Esc</strong>：关闭弹窗或隐藏透镜
        </div>
      </div>
    </div>
  </div>

  <script src="js/translation.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
