name: Build TransEase Windows Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Build TransEase via Tauri CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          npx @tauri-apps/cli build --verbose 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Tauri build failed with exit code $LASTEXITCODE"
            Get-Content build.log -Tail 150
            exit $LASTEXITCODE
          }

      - name: Organize Windows Distribution Packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release
          
          # 查找 NSIS 安装包并复制重命名
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "dist-release/TransEase_Windows_Setup.exe"
            Write-Host "Found NSIS Setup: $($nsis.FullName)"
          }

          # 查找独立便携版 exe 并复制重命名
          $portable = Get-ChildItem -Path "src-tauri/target/release/transease.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($portable) {
            Copy-Item $portable.FullName "dist-release/TransEase_Windows_Portable.exe"
            Write-Host "Found Portable Binary: $($portable.FullName)"
          }

          Get-ChildItem -Path dist-release

      - name: Upload Windows Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransEase-Windows-v3.1.0
          path: dist-release/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: v3.1.0-win
          name: "TransEase Windows v3.1.0"
          body: |
            ### TransEase (透镜) - Windows 官方版本 v3.1.0
            
            - **TransEase_Windows_Setup.exe**：Windows 原生安装程序（支持桌面图标、开始菜单、开机自启配置）。
            - **TransEase_Windows_Portable.exe**：独立免安装便携版（双击即用，零系统残留）。
            
            **核心功能**：
            - Windows 原生 DirectComposition 穿透随动透镜
            - WASAPI 回环实时多语种阶梯字幕
            - 百度官方直连毫秒诊断
          files: |
            dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
